<div class="home-container">
  <div class="home-content">
    <h1>Browse Vehicles</h1>
    <app-filters
      [vehicles]="(vehicles$ | async) ?? []"
      (filterChanged)="onFilterChanged($event)"
    ></app-filters>
    <app-car-list [vehicles]="(filteredVehicles$ | async) ?? []"></app-car-list>
  </div>
</div>

<div class="filters-container" [formGroup]="filterForm">
  <h3>Filters</h3>

  <mat-form-field appearance="outline">
    <mat-label>Manufacturer</mat-label>
    <mat-select formControlName="manufacturer">
      <mat-option
        *ngFor="let option of filters.manufacturer.options"
        [value]="option"
      >
        {{ option }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Body Type</mat-label>
    <mat-select formControlName="bodyType">
      <mat-option *ngFor="let option of filters.body!.options" [value]="option">
        {{ option }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div formGroupName="priceRange" class="price-range">
    <mat-form-field appearance="outline">
      <mat-label>Minimum Price</mat-label>
      <input
        matInput
        type="number"
        formControlName="min"
        min="0"
        step="1000"
        class="no-spinner"
      />
      <span matPrefix>R&nbsp;</span>
      <mat-hint>Leave empty for no minimum</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Maximum Price</mat-label>
      <input
        matInput
        type="number"
        formControlName="max"
        min="0"
        step="1000"
        class="no-spinner"
      />
      <span matPrefix>R&nbsp;</span>
      <mat-hint>Leave empty for no maximum</mat-hint>
    </mat-form-field>
  </div>
</div>
